<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title>Handwriting Documents</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f5f7fa;
    }

    h1 {
      color: #2c3e50;
    }

    .upload-button {
      display: inline-block;
      padding: 10px 18px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .upload-button:hover {
      background-color: #2980b9;
    }

    .document {
      background-color: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .document h3 {
      margin-top: 0;
      color: #2c3e50;
    }

    .open-button {
      display: inline-block;
      padding: 8px 14px;
      background-color: #27ae60;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-right: 10px;
    }
    .annotate-button {
      display: inline-block;
      padding: 8px 14px;
      background-color: #8e44ad;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-right: 10px;
    }

    .annotate-button:hover {
      background-color: #71368a;
    }

    .open-button:hover {
      background-color: #219150;
    }

    .delete-button {
      padding: 8px 14px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .delete-button:hover {
      background-color: #c0392b;
    }

    .actions {
      margin-top: 10px;
    }

  </style>

</head>

<body>

<h1>Handwriting Documents</h1>

<a href="/documents/upload" class="upload-button">
  Upload Document
</a>

<hr>

<div th:if="${documents.isEmpty()}">

  <p>No documents available.</p>

</div>

<div th:unless="${documents.isEmpty()}">

  <div class="document"
       th:each="document : ${documents}">

    <h3 th:text="${document.name}">
      Document name
    </h3>

    <div class="actions">

      <!-- Open document -->

      <a
              th:href="@{/documents/{id}/view(id=${document.id})}"
              target="_blank"
              class="open-button">

        Open Document

      </a>

      <a
              th:href="@{/documents/{id}/annotate(id=${document.id})}"
              class="annotate-button">

        Annotate

      </a>

      <!-- Delete document -->

      <form
              th:action="@{/documents/{id}/delete(id=${document.id})}"
              method="post"
              style="display: inline;">

        <button
                type="submit"
                class="delete-button"
                onclick="return confirm('Are you sure you want to delete this document?');">

          Delete Document

        </button>

      </form>

    </div>

  </div>

</div>

</body>

</html>
